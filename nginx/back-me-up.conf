server {
    listen 80;
    server_name _;

    # 0 = unlimited request body size (essential for large database dumps/backups)
    # You can also set a specific cap such as 50G (matching your 50GB block volume)
    client_max_body_size 0;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        
        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket / Change Streams Support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts for long-running backup/restore operations
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}
